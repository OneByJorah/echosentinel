[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "echosentinel"
version = "1.0.0"
description = "Self-hosted audio-only RTSP surveillance: live listening, recording, local transcription and acoustic event detection."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "OneByJorah" }]
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "httpx==0.28.1",
  "psutil==7.2.2",
  "cryptography==50.0.2",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
stt = ["faster-whisper==1.2.1"]
classifier = ["ai-edge-litert==2.3.0"]
all = ["faster-whisper==1.2.1", "ai-edge-litert==2.3.0"]
dev = ["pytest==9.0.3", "pytest-asyncio==1.4.1", "ruff==0.17.3", "pip-audit==2.10.1"]

[project.scripts]
echosentinel = "echosentinel.cli:main"

[tool.setuptools.packages.find]
include = ["echosentinel*"]

[tool.setuptools.package-data]
"echosentinel.migrations" = ["*.sql"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "S603", "S607", "S311", "B008", "S104", "ASYNC109", "ASYNC210", "ASYNC230", "ASYNC240", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E501", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
